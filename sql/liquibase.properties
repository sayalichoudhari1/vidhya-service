## Liquibase connection properties for the Vidhya Service local database.
## Variables (DB_HOST, DB_PORT, DB_NAME, DB_MASTER_USER, DB_MASTER_PASS) are
## substituted by devops/local/liquibase/init-scripts/setup.sh at container
## start (envsubst), sourced from devops/local/.env.
url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
username: ${DB_MASTER_USER}
password: ${DB_MASTER_PASS}
driver: org.postgresql.Driver
changeLogFile: dbchangelog.xml
liquibase.headless: true
